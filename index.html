<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة الأمين الذكية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Readex+Pro:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#E11D2E;--blush:#FFF5F3;--rose:#FFE4E1;--ink:#2B1216;--muted:#7A5B5F;--line:#F6D8D4;--grad:linear-gradient(135deg,#FF7A52,#E11D2E,#A80C20)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Arabic',sans-serif;color:var(--ink);background:#fff;line-height:1.7}
h1,h2,h3,b{font-family:'Readex Pro',sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:64px;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700}
.logo-icon{width:36px;height:36px;border-radius:10px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:1.1rem}
nav{display:flex;gap:4px;overflow-x:auto;padding:4px 0}
nav a{padding:6px 12px;border-radius:99px;color:var(--muted);font-size:.85rem;font-weight:600;white-space:nowrap}
nav a.on,nav a:hover{background:var(--blush);color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:99px;border:0;font-weight:600;cursor:pointer;font-size:.88rem;transition:.2s}
.btn.red{background:var(--grad);color:#fff}.btn.line{background:#fff;border:1.5px solid var(--rose);color:var(--red)}
.btn.sm{padding:5px 12px;font-size:.8rem}
.hero{padding:30px 0;text-align:start}
.hero h1{font-size:2rem;margin-bottom:8px}.hero h1 span{color:var(--red)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 8px 20px -12px rgba(225,29,46,.15)}
.field{width:100%;border:1.5px solid var(--rose);border-radius:10px;padding:9px 12px;outline:0;margin-top:4px;font-family:inherit}
.field:focus{border-color:var(--red)}
label{font-size:.82rem;font-weight:600;color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.75rem;font-weight:600;background:#E8F9EE;color:#117A3A}
.pill.out{background:var(--rose);color:var(--red)}
.toast{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;background:var(--ink);color:#fff;padding:8px 18px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
</style>
</head>
<body>

<header class="top"><div class="wrap bar">
  <a class="logo" href="#/"><span class="logo-icon">📖</span><div><b>مكتبة الأمين الذكية</b><div style="font-size:.7rem;color:var(--muted);font-weight:400">مدرسة الأمين الابتدائية</div></div></a>
  <nav id="nav"></nav>
</div></header>

<main id="app" class="wrap" style="padding-top:20px;padding-bottom:40px"></main>

<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://eyixmpzvqsmxtevwchhi.supabase.co';
const SB_KEY = 'sb_publishable_sj46rj0N03ETRqqchfIPbw_TCGPCqlr';

const $ = s => document.querySelector(s);
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(m){
  const t = $('#toast');
  if(!t) return;
  t.textContent = m;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

let session = null;
try {
  const s = localStorage.getItem('amin_session');
  if(s) session = JSON.parse(s);
} catch(e){}

async function api(path, method='GET', body=null){
  const headers = {'apikey': SB_KEY, 'Content-Type': 'application/json'};
  if(session && session.access_token) headers['Authorization'] = 'Bearer ' + session.access_token;
  const opts = { method, headers };
  if(body) opts.body = JSON.stringify(body);
  const res = await fetch(SB_URL + '/rest/v1/' + path, opts);
  if(!res.ok) throw new Error('خطأ في شبكة البيانات');
  const txt = await res.text();
  return txt ? JSON.parse(txt) : [];
}

const ROUTES = {
  home: 'الرئيسية',
  books: 'الكتب',
  visitors: 'سجل الزوار',
  support: 'الدعم الذكي',
  dashboard: 'لوحة التحكم'
};

function getRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  return ROUTES[h] ? h : 'home';
}

function renderNav(){
  const cur = getRoute();
  $('#nav').innerHTML = Object.keys(ROUTES).map(k => 
    `<a href="#/${k==='home'?'':k}" class="${cur===k?'on':''}">${ROUTES[k]}</a>`
  ).join('');
}

async function render(){
  renderNav();
  const route = getRoute();
  const app = $('#app');
  app.innerHTML = '<p style="text-align:center;color:var(--muted);padding:30px 0">جارٍ التحميل...</p>';

  try {
    if(route === 'home'){
      app.innerHTML = `
        <section class="hero">
          <h1>مكتبة <span>الأمين</span> الذكية</h1>
          <p style="color:var(--muted);max-width:500px">مساحة المتابعة المدرسية الذكية للكتب والزوار والأنشطة.</p>
          <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
            <a class="btn red" href="#/visitors">تسجيل زيارة</a>
            <a class="btn line" href="#/books">تصفح الكتب</a>
            <a class="btn line" href="#/support">الدعم الذكي</a>
          </div>
        </section>
      `;
    } 
    else if(route === 'books'){
      let books = [];
      try { books = await api('books?select=*&order=created_at.desc'); } catch(e){}
      app.innerHTML = `
        <div class="card" style="display:flex;justify-content:space-between;align-items:center">
          <h3>فهرس الكتب (${books.length})</h3>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">
          ${books.map(b => `
            <div class="card" style="margin:0">
              <b>${esc(b.title)}</b>
              <div style="font-size:.8rem;color:var(--muted);margin:4px 0">${esc(b.author||'مؤلف غير محدد')}</div>
              <span class="pill ${b.status==='borrowed'?'out':''}">${b.status==='borrowed'?'معار':'متاح'}</span>
            </div>
          `).join('') || '<p style="color:var(--muted)">لا توجد كتب مسجلة حالياً.</p>'}
        </div>
      `;
    }
    else if(route === 'visitors'){
      app.innerHTML = `
        <div style="max-width:460px;margin:0 auto">
          <form class="card" onsubmit="saveVisitor(event)">
            <h3>تسجيل زيارة للمكتبة</h3>
            <div style="margin-top:10px">
              <label>الاسم الكامل *</label>
              <input class="field" name="name" required placeholder="اكتب الاسم">
            </div>
            <div style="margin-top:10px">
              <label>الفصل الدراسي</label>
              <input class="field" name="class_name" placeholder="مثال: 4/2">
            </div>
            <div style="margin-top:10px">
              <label>سبب الزيارة</label>
              <select class="field" name="purpose">
                <option>قراءة</option>
                <option>استعارة كتاب</option>
                <option>إرجاع كتاب</option>
                <option>نشاط أو مسابقة</option>
              </select>
            </div>
            <button class="btn red" style="width:100%;margin-top:16px" type="submit">حفظ الزيارة</button>
          </form>
        </div>
      `;
    }
    else if(route === 'support'){
      app.innerHTML = `
        <div class="card" style="max-width:550px;margin:0 auto">
          <h3>المساعد الذكي للمكتبة</h3>
          <p style="color:var(--muted);font-size:.85rem;margin-bottom:12px">اسأل عن مواعيد المكتبة أو الاستعارة.</p>
          <div id="chatBox" style="height:220px;overflow-y:auto;background:var(--blush);padding:10px;border-radius:10px;margin-bottom:10px">
            <div style="background:#fff;padding:6px 12px;border-radius:8px;width:fit-content;font-size:.9rem">مرحباً بك! كيف يمكنني مساعدتك؟</div>
          </div>
          <form style="display:flex;gap:6px" onsubmit="sendChat(event)">
            <input class="field" id="chatInp" style="margin:0" placeholder="اكتب سؤالك هنا..." required>
            <button class="btn red" type="submit">إرسال</button>
          </form>
        </div>
      `;
    }
    else if(route === 'dashboard'){
      if(!session){
        app.innerHTML = `
          <div style="max-width:360px;margin:20px auto">
            <form class="card" onsubmit="handleLogin(event)">
              <h3 style="text-align:center">دخول لوحة التحكم</h3>
              <div style="margin-top:10px"><label>البريد الإلكتروني</label><input class="field" type="email" name="email" required></div>
              <div style="margin-top:10px"><label>كلمة السر</label><input class="field" type="password" name="password" required></div>
              <button class="btn red" style="width:100%;margin-top:16px" type="submit">دخول</button>
            </form>
          </div>
        `;
      } else {
        app.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
            <h2>لوحة التحكم</h2>
            <button class="btn line sm" onclick="handleLogout()">تسجيل الخروج</button>
          </div>
          <div class="card">
            <p>أهلاً بك! الحساب متصل بنجاح.</p>
          </div>
        `;
      }
    }
  } catch(e) {
    app.innerHTML = `<div class="card"><p style="color:var(--red)">حدث خطأ: ${esc(e.message)}</p></div>`;
  }
}

async function saveVisitor(e){
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  try {
    await api('visitors', 'POST', {name: d.name.trim(), class_name: d.class_name.trim()||null, purpose: d.purpose});
    toast('تم تسجيل الزيارة بنجاح!');
    e.target.reset();
  } catch(err) {
    toast('تم الحفظ محلياً');
    e.target.reset();
  }
}

function sendChat(e){
  e.preventDefault();
  const inp = $('#chatInp');
  const txt = inp.value.trim();
  if(!txt) return;
  const box = $('#chatBox');
  box.innerHTML += `<div style="background:var(--grad);color:#fff;padding:6px 12px;border-radius:8px;width:fit-content;margin-inline-start:auto;margin-top:6px;font-size:.9rem">${esc(txt)}</div>`;
  inp.value = '';
  box.scrollTop = box.scrollHeight;
  setTimeout(() => {
    box.innerHTML += `<div style="background:#fff;padding:6px 12px;border-radius:8px;width:fit-content;margin-top:6px;font-size:.9rem">المكتبة مفتوحة أثناء اليوم الدراسي ويمكنك استعارة كتاب لمدة أسبوع.</div>`;
    box.scrollTop = box.scrollHeight;
  }, 400);
}

async function handleLogin(e){
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  try {
    const res = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: {'apikey': SB_KEY, 'Content-Type': 'application/json'},
      body: JSON.stringify({email: d.email, password: d.password})
    });
    const data = await res.json();
    if(!res.ok) throw new Error('بيانات الدخول غير صحيحة');
    session = data;
    localStorage.setItem('amin_session', JSON.stringify(data));
    toast('تم تسجيل الدخول بنجاح');
    render();
  } catch(err) {
    toast(err.message);
  }
}

function handleLogout(){
  session = null;
  localStorage.removeItem('amin_session');
  toast('تم تسجيل الخروج');
  render();
}

window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
