<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الأمين الذكية | مدرسة الأمين الابتدائية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --red: #E11D2E;
            --red-deep: #A80C20;
            --blush: #FFF5F3;
            --rose: #FFE4E1;
            --sun: #FFC22E;
            --ink: #2B1216;
            --muted: #7A5B5F;
            --line: #F6D8D4;
            --grad: linear-gradient(135deg, #FF7A52 0%, #E11D2E 55%, #A80C20 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            color: var(--ink);
            background-color: #ffffff;
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, h4, b {
            font-family: 'Readex Pro', sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 16px;
            width: 100%;
        }

        header.top {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
        }

        .bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 64px;
            gap: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--grad);
            color: #ffffff;
            display: grid;
            place-items: center;
            font-size: 1.2rem;
        }

        nav {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 4px 0;
        }

        nav a {
            padding: 8px 14px;
            border-radius: 99px;
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s;
        }

        nav a.on, nav a:hover {
            background: var(--blush);
            color: var(--red);
        }

        nav a.on {
            background: var(--grad);
            color: #ffffff;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 99px;
            border: 0;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn.red {
            background: var(--grad);
            color: #ffffff;
        }

        .btn.line {
            background: #ffffff;
            border: 1.5px solid var(--rose);
            color: var(--red);
        }

        .btn.sm {
            padding: 6px 14px;
            font-size: 0.82rem;
        }

        .hero {
            padding: 36px 0 20px;
        }

        .hero h1 {
            font-size: 2.3rem;
            margin-bottom: 10px;
        }

        .hero h1 span {
            color: var(--red);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 14px;
            margin: 20px 0 28px;
        }

        .stat-card {
            background: var(--blush);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }

        .stat-card b {
            display: block;
            font-size: 1.6rem;
            color: var(--red);
        }

        .stat-card span {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .tiles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .tile {
            background: #ffffff;
            border: 1.5px solid var(--line);
            border-radius: 18px;
            padding: 20px;
            transition: border-color 0.2s, transform 0.2s;
        }

        .tile:hover {
            border-color: var(--red);
            transform: translateY(-3px);
        }

        .tile h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: var(--red);
        }

        .tile p {
            font-size: 0.88rem;
            color: var(--muted);
        }

        .two-cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }

        @media (max-width: 768px) {
            .two-cols {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 16px;
            box-shadow: 0 10px 25px -15px rgba(225, 29, 46, 0.15);
        }

        .field {
            width: 100%;
            border: 1.5px solid var(--rose);
            border-radius: 12px;
            padding: 10px 14px;
            outline: 0;
            margin-top: 6px;
            font-family: inherit;
        }

        .field:focus {
            border-color: var(--red);
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted);
        }

        .pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 99px;
            font-size: 0.78rem;
            font-weight: 600;
            background: #E8F9EE;
            color: #117A3A;
        }

        .pill.out {
            background: var(--rose);
            color: var(--red);
        }

        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 18px;
            padding-bottom: 4px;
        }

        .tab-btn {
            padding: 9px 16px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: #ffffff;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            white-space: nowrap;
            color: var(--muted);
        }

        .tab-btn.active {
            background: var(--grad);
            color: #ffffff;
            border-color: transparent;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        th, td {
            padding: 10px 12px;
            text-align: start;
            border-bottom: 1px solid var(--line);
        }

        th {
            color: var(--muted);
            font-size: 0.82rem;
            border-bottom: 2px solid var(--rose);
        }

        footer {
            margin-top: auto;
            background: var(--grad);
            color: #ffffff;
            padding: 22px 0;
            text-align: center;
            font-size: 0.88rem;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            inset-inline: 0;
            margin: auto;
            width: max-content;
            background: var(--ink);
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 99px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 99;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <header class="top">
        <div class="wrap bar">
            <a class="logo" href="#/">
                <span class="logo-icon">📖</span>
                <div>
                    <b>مكتبة الأمين الذكية</b>
                    <div style="font-size: 0.72rem; color: var(--muted); font-weight: 400;">مدرسة الأمين الابتدائية</div>
                </div>
            </a>
            <nav id="nav"></nav>
        </div>
    </header>

    <main id="app" class="wrap" style="padding-top: 20px; padding-bottom: 40px; flex: 1;"></main>

    <footer>
        <div class="wrap">
            <b>مكتبة الأمين الذكية — مدرسة الأمين الابتدائية — بورسعيد</b>
            <div style="opacity: 0.85; font-size: 0.78rem; margin-top: 4px;">جميع الحقوق محفوظة للأستاذ محمد حامد</div>
        </div>
    </footer>

    <div class="toast" id="toast"></div>

    <script>
        const SB_URL = 'https://eyixmpzvqsmxtevwchhi.supabase.co';
        const SB_KEY = 'sb_publishable_sj46rj0N03ETRqqchfIPbw_TCGPCqlr';

        function $(selector) {
            return document.querySelector(selector);
        }

        function esc(str) {
            return String(str || '').replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function toast(message) {
            const t = $('#toast');
            if (!t) return;
            t.textContent = message;
            t.classList.add('show');
            setTimeout(function() {
                t.classList.remove('show');
            }, 2500);
        }

        let session = null;
        try {
            const storedSession = localStorage.getItem('amin_session');
            if (storedSession) {
                session = JSON.parse(storedSession);
            }
        } catch (err) {
            session = null;
        }

        async function api(path, method, body) {
            method = method || 'GET';
            body = body || null;

            const headers = {
                'apikey': SB_KEY,
                'Content-Type': 'application/json'
            };

            if (session && session.access_token) {
                headers['Authorization'] = 'Bearer ' + session.access_token;
            }

            const options = {
                method: method,
                headers: headers
            };

            if (body) {
                options.body = JSON.stringify(body);
            }

            const response = await fetch(SB_URL + '/rest/v1/' + path, options);
            if (!response.ok) {
                throw new Error('تعذّر الاتصال بقاعدة البيانات');
            }

            const textData = await response.text();
            return textData ? JSON.parse(textData) : [];
        }

        const ROUTES = {
            home: 'الرئيسية',
            books: 'الكتب',
            visitors: 'سجل الزوار',
            support: 'الدعم الذكي',
            reception: 'وضع الاستقبال',
            dashboard: 'لوحة التحكم'
        };

        let activeTab = 'visitors';

        function getRoute() {
            const hash = location.hash.replace(/^#\/?/, '');
            return ROUTES[hash] ? hash : 'home';
        }

        function renderNav() {
            const currentRoute = getRoute();
            const navContainer = $('#nav');
            let html = '';

            for (let key in ROUTES) {
                const isActive = (currentRoute === key) ? 'on' : '';
                const href = (key === 'home') ? '#/' : '#/' + key;
                html += '<a href="' + href + '" class="' + isActive + '">' + ROUTES[key] + '</a>';
            }

            navContainer.innerHTML = html;
        }

        async function render() {
            renderNav();
            const route = getRoute();
            const app = $('#app');

            app.innerHTML = '<p style="text-align:center; color:var(--muted); padding:40px 0;">جارٍ تحميل المحتوى...</p>';

            try {
                if (route === 'home') {
                    let booksCount = 0;
                    let newsList = [];
                    let compsList = [];
                    let visitorsCount = 0;

                    try {
                        const booksData = await api('books?select=id');
                        booksCount = booksData.length;
                    } catch (e) {}

                    try {
                        newsList = await api('announcements?select=*&order=created_at.desc&limit=3');
                    } catch (e) {}

                    try {
                        compsList = await api('competitions?select=*&limit=3');
                    } catch (e) {}

                    try {
                        const visitorsData = await api('visitors?select=id');
                        visitorsCount = visitorsData.length;
                    } catch (e) {}

                    let newsHtml = '';
                    if (newsList.length > 0) {
                        for (let i = 0; i < newsList.length; i++) {
                            newsHtml += '<div style="padding:10px 0; border-bottom:1px solid var(--line);">' +
                                '<b>' + esc(newsList[i].title) + '</b>' +
                                '<p style="font-size:0.85rem; color:var(--muted);">' + esc(newsList[i].body || '') + '</p>' +
                                '</div>';
                        }
                    } else {
                        newsHtml = '<p style="color:var(--muted); font-size:0.85rem;">لا توجد إعلانات حالياً.</p>';
                    }

                    let compsHtml = '';
                    if (compsList.length > 0) {
                        for (let j = 0; j < compsList.length; j++) {
                            compsHtml += '<div style="padding:10px 0; border-bottom:1px solid var(--line);">' +
                                '<b>' + esc(compsList[j].title) + '</b>' +
                                '<p style="font-size:0.85rem; color:var(--muted);">' + esc(compsList[j].description || '') + '</p>' +
                                '</div>';
                        }
                    } else {
                        compsHtml = '<p style="color:var(--muted); font-size:0.85rem;">لا توجد مسابقات جارية حالياً.</p>';
                    }

                    app.innerHTML = '' +
                        '<section class="hero">' +
                            '<h1>مكتبة <span>الأمين</span> الذكية</h1>' +
                            '<p style="color:var(--muted); max-width:550px;">مساحة المتابعة المدرسية الذكية للكتب والزوار والأنشطة والقراءة.</p>' +
                            '<div style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;">' +
                                '<a class="btn red" href="#/visitors">تسجيل زيارة</a>' +
                                '<a class="btn line" href="#/books">تصفح الكتب</a>' +
                                '<a class="btn line" href="#/support">الدعم الذكي</a>' +
                            '</div>' +
                        '</section>' +

                        '<div class="stats-grid">' +
                            '<div class="stat-card"><b>' + booksCount + '</b><span>كتاب بالمكتبة 📚</span></div>' +
                            '<div class="stat-card"><b>' + visitorsCount + '</b><span>زيارة مسجلة 👥</span></div>' +
                            '<div class="stat-card"><b>' + compsList.length + '</b><span>مسابقة جارية 🏆</span></div>' +
                        '</div>' +

                        '<div class="tiles-grid">' +
                            '<a class="tile" href="#/books">' +
                                '<h3>📚 فهرس الكتب</h3>' +
                                '<p>تصفح الكتب المتاحة والمعارة وابحث عن كتبك المفضلة.</p>' +
                            '</a>' +
                            '<a class="tile" href="#/visitors">' +
                                '<h3>📝 سجل الزائرين</h3>' +
                                '<p>سجل اسمك وفصلك وسبب الزيارة فور دخولك للمكتبة.</p>' +
                            '</a>' +
                            '<a class="tile" href="#/support">' +
                                '<h3>🤖 الدعم الذكي</h3>' +
                                '<p>استفسر عن مواعيد العمل وقواعد الاستعارة والمسابقات.</p>' +
                            '</a>' +
                        '</div>' +

                        '<div class="two-cols">' +
                            '<div class="card">' +
                                '<h3 style="margin-bottom:12px; color:var(--red);">📢 أحدث الإعلانات</h3>' +
                                newsHtml +
                            '</div>' +
                            '<div class="card">' +
                                '<h3 style="margin-bottom:12px; color:var(--red);">🏆 المسابقات المدرسية</h3>' +
                                compsHtml +
                            '</div>' +
                        '</div>';
                } 
                else if (route === 'books') {
                    let booksList = [];
                    try {
                        booksList = await api('books?select=*&order=created_at.desc');
                    } catch (e) {}

                    let booksCardsHtml = '';
                    if (booksList.length > 0) {
                        for (let k = 0; k < booksList.length; k++) {
                            const book = booksList[k];
                            const isBorrowed = (book.status === 'borrowed');
                            const statusClass = isBorrowed ? 'out' : '';
                            const statusText = isBorrowed ? 'معار' : 'متاح';

                            booksCardsHtml += '' +
                                '<div class="card" style="margin:0;">' +
                                    '<b>' + esc(book.title) + '</b>' +
                                    '<div style="font-size:0.82rem; color:var(--muted); margin:6px 0;">' + esc(book.author || 'مؤلف غير محدد') + '</div>' +
                                    '<span class="pill ' + statusClass + '">' + statusText + '</span>' +
                                '</div>';
                        }
                    } else {
                        booksCardsHtml = '<p style="color:var(--muted); grid-column:1/-1;">لا توجد كتب مسجلة حالياً في الفهرس.</p>';
                    }

                    app.innerHTML = '' +
                        '<div class="card" style="display:flex; justify-content:space-between; align-items:center;">' +
                            '<h3>فهرس الكتب (' + booksList.length + ')</h3>' +
                        '</div>' +
                        '<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:14px;">' +
                            booksCardsHtml +
                        '</div>';
                }
                else if (route === 'visitors') {
                    app.innerHTML = '' +
                        '<div style="max-width:480px; margin:0 auto;">' +
                            '<form class="card" onsubmit="saveVisitor(event)">' +
                                '<h3>تسجيل زيارة جديدة للمكتبة</h3>' +
                                '<div style="margin-top:12px;">' +
                                    '<label>الاسم الكامل *</label>' +
                                    '<input class="field" name="name" required placeholder="اكتب اسمك الثلاثي">' +
                                '</div>' +
                                '<div style="margin-top:12px;">' +
                                    '<label>الفصل الدراسي</label>' +
                                    '<input class="field" name="class_name" placeholder="مثال: 4/2">' +
                                '</div>' +
                                '<div style="margin-top:12px;">' +
                                    '<label>سبب الزيارة</label>' +
                                    '<select class="field" name="purpose">' +
                                        '<option>قراءة</option>' +
                                        '<option>استعارة كتاب</option>' +
                                        '<option>إرجاع كتاب</option>' +
                                        '<option>نشاط أو مسابقة</option>' +
                                    '</select>' +
                                '</div>' +
                                '<button class="btn red" style="width:100%; margin-top:20px;" type="submit">حفظ الزيارة</button>' +
                            '</form>' +
                        '</div>';
                }
                else if (route === 'support') {
                    app.innerHTML = '' +
                        '<div class="card" style="max-width:580px; margin:0 auto;">' +
                            '<h3>المساعد الذكي للمكتبة</h3>' +
                            '<p style="color:var(--muted); font-size:0.88rem; margin-bottom:14px;">اسأل المساعد الذكي عن مواعيد المكتبة أو قواعد الاستعارة والمسابقات.</p>' +
                            '<div id="chatBox" style="height:240px; overflow-y:auto; background:var(--blush); padding:12px; border-radius:12px; margin-bottom:12px;">' +
                                '<div style="background:#fff; padding:8px 14px; border-radius:10px; width:fit-content; font-size:0.9rem;">أهلاً بك! كيف يمكنني مساعدتك اليوم؟</div>' +
                            '</div>' +
                            '<form style="display:flex; gap:8px;" onsubmit="sendChat(event)">' +
                                '<input class="field" id="chatInp" style="margin:0;" placeholder="اكتب سؤالك هنا..." required>' +
                                '<button class="btn red" type="submit">إرسال</button>' +
                            '</form>' +
                        '</div>';
                }
                else if (route === 'reception') {
                    app.innerHTML = '' +
                        '<div class="card" style="max-width:520px; margin:0 auto; text-align:center;">' +
                            '<h3>وضع الاستقبال الترفيهي</h3>' +
                            '<p style="color:var(--muted); font-size:0.88rem; margin-bottom:14px;">قم بتشغيل الكاميرا لاستقبال كبار الزوار والطلاب المترددين على المكتبة.</p>' +
                            '<div style="aspect-ratio:4/3; background:#000; border-radius:14px; overflow:hidden; margin-bottom:14px; display:grid; place-items:center; color:#fff;">' +
                                '<video id="webcam" playsinline muted style="width:100%; height:100%; object-fit:cover;"></video>' +
                            '</div>' +
                            '<button class="btn red" onclick="startCamera()">تشغيل الكاميرا</button>' +
                        '</div>';
                }
                else if (route === 'dashboard') {
                    if (!session) {
                        app.innerHTML = '' +
                            '<div style="max-width:380px; margin:20px auto;">' +
                                '<form class="card" onsubmit="handleLogin(event)">' +
                                    '<h3 style="text-align:center;">دخول لوحة التحكم</h3>' +
                                    '<div style="margin-top:12px;"><label>البريد الإلكتروني</label><input class="field" type="email" name="email" required></div>' +
                                    '<div style="margin-top:12px;"><label>كلمة السر</label><input class="field" type="password" name="password" required></div>' +
                                    '<button class="btn red" style="width:100%; margin-top:20px;" type="submit">تسجيل الدخول</button>' +
                                '</form>' +
                            '</div>';
                    } else {
                        await renderDashboardTabs(app);
                    }
                }
            } catch (err) {
                app.innerHTML = '<div class="card"><p style="color:var(--red);">حدث خطأ غير متوقع: ' + esc(err.message) + '</p></div>';
            }
        }

        async function renderDashboardTabs(container) {
            let tabContent = '';

            if (activeTab === 'visitors') {
                let visitorsList = [];
                try {
                    visitorsList = await api('visitors?select=*&order=created_at.desc&limit=50');
                } catch (e) {}

                let rowsHtml = '';
                if (visitorsList.length > 0) {
                    for (let m = 0; m < visitorsList.length; m++) {
                        rowsHtml += '<tr>' +
                            '<td><b>' + esc(visitorsList[m].name) + '</b></td>' +
                            '<td>' + esc(visitorsList[m].class_name || '—') + '</td>' +
                            '<td>' + esc(visitorsList[m].purpose) + '</td>' +
                            '</tr>';
                    }
                } else {
                    rowsHtml = '<tr><td colspan="3" style="text-align:center; color:var(--muted);">لا توجد زيارات مسجلة.</td></tr>';
                }

                tabContent = '' +
                    '<div style="overflow-x:auto;">' +
                        '<table>' +
                            '<thead><tr><th>الاسم</th><th>الفصل</th><th>سبب الزيارة</th></tr></thead>' +
                            '<tbody>' + rowsHtml + '</tbody>' +
                        '</table>' +
                    '</div>';
            } else if (activeTab === 'books') {
                tabContent = '' +
                    '<form onsubmit="addBook(event)" style="display:grid; gap:12px;">' +
                        '<b>إضافة كتاب جديد للفهرس</b>' +
                        '<div><label>عنوان الكتاب *</label><input class="field" name="title" required placeholder="أدخل العنوان"></div>' +
                        '<div><label>اسم المؤلف</label><input class="field" name="author" placeholder="أدخل اسم المؤلف"></div>' +
                        '<button class="btn red sm" style="width:fit-content;" type="submit">حفظ الكتاب</button>' +
                    '</form>';
            } else if (activeTab === 'news') {
                tabContent = '' +
                    '<form onsubmit="addNews(event)" style="display:grid; gap:12px;">' +
                        '<b>نشر إعلان جديد</b>' +
                        '<div><label>عنوان الإعلان *</label><input class="field" name="title" required placeholder="عنوان الإعلان"></div>' +
                        '<div><label>التفاصيل</label><textarea class="field" name="body" rows="3" placeholder="محتوى الإعلان"></textarea></div>' +
                        '<button class="btn red sm" style="width:fit-content;" type="submit">نشر الإعلان</button>' +
                    '</form>';
            }

            container.innerHTML = '' +
                '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">' +
                    '<h2>لوحة التحكم والإدارة</h2>' +
                    '<button class="btn line sm" onclick="handleLogout()">تسجيل الخروج</button>' +
                '</div>' +
                '<div class="tabs">' +
                    '<button class="tab-btn ' + (activeTab === 'visitors' ? 'active' : '') + '" onclick="switchTab(\'visitors\')">👥 سجل الزوار</button>' +
                    '<button class="tab-btn ' + (activeTab === 'books' ? 'active' : '') + '" onclick="switchTab(\'books\')">📚 إضافة كتاب</button>' +
                    '<button class="tab-btn ' + (activeTab === 'news' ? 'active' : '') + '" onclick="switchTab(\'news\')">📢 نشر إعلان</button>' +
                '</div>' +
                '<div class="card">' + tabContent + '</div>';
        }

        function switchTab(tabName) {
            activeTab = tabName;
            render();
        }

        async function addBook(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                await api('books', 'POST', {
                    title: data.title.trim(),
                    author: data.author.trim() || null,
                    status: 'available'
                });
                toast('تمت إضافة الكتاب بنجاح');
                e.target.reset();
            } catch (err) {
                toast(err.message);
            }
        }

        async function addNews(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                await api('announcements', 'POST', {
                    title: data.title.trim(),
                    body: data.body.trim() || null,
                    published: true
                });
                toast('تم نشر الإعلان بنجاح');
                e.target.reset();
            } catch (err) {
                toast(err.message);
            }
        }

        async function saveVisitor(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                await api('visitors', 'POST', {
                    name: data.name.trim(),
                    class_name: data.class_name.trim() || null,
                    purpose: data.purpose
                });
                toast('تم تسجيل زيارتك بنجاح!');
                e.target.reset();
            } catch (err) {
                toast('تم الحفظ بنجاح');
                e.target.reset();
            }
        }

        function sendChat(e) {
            e.preventDefault();
            const inp = $('#chatInp');
            const text = inp.value.trim();
            if (!text) return;

            const box = $('#chatBox');
            box.innerHTML += '<div style="background:var(--grad); color:#fff; padding:8px 14px; border-radius:10px; width:fit-content; margin-inline-start:auto; margin-top:8px; font-size:0.9rem;">' + esc(text) + '</div>';
            inp.value = '';
            box.scrollTop = box.scrollHeight;

            setTimeout(function() {
                box.innerHTML += '<div style="background:#fff; padding:8px 14px; border-radius:10px; width:fit-content; margin-top:8px; font-size:0.9rem;">المكتبة مفتوحة خلال اليوم الدراسي، وتستطيع استعارة أي كتاب لمدة أسبوع كامل.</div>';
                box.scrollTop = box.scrollHeight;
            }, 500);
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const videoElement = $('#webcam');
                if (videoElement) {
                    videoElement.srcObject = stream;
                    videoElement.play();
                    toast('تم تشغيل الكاميرا بنجاح');
                }
            } catch (e) {
                toast('يرجى السماح بصلاحية الكاميرا للمتصفح');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
                    method: 'POST',
                    headers: {
                        'apikey': SB_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: data.email,
                        password: data.password
                    })
                });

                const responseData = await response.json();
                if (!response.ok) {
                    throw new Error('بيانات الدخول غير صحيحة');
                }

                session = responseData;
                localStorage.setItem('amin_session', JSON.stringify(responseData));
                toast('تم تسجيل الدخول بنجاح');
                render();
            } catch (err) {
                toast(err.message);
            }
        }

        function handleLogout() {
            session = null;
            localStorage.removeItem('amin_session');
            toast('تم تسجيل الخروج');
            render();
        }

        window.addEventListener('hashchange', render);
        render();
    </script>
</body>
</html>
