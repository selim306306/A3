<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبة الأمين الذكية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Readex+Pro:wght@600;700&display=swap">
<style>
:root{--red:#E11D2E;--red-d:#A80C20;--blush:#FFF5F3;--rose:#FFE4E1;--sun:#FFC22E;--ink:#2B1216;--muted:#7A5B5F;--line:#F6D8D4;--grad:linear-gradient(135deg,#FF7A52,#E11D2E,#A80C20)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Arabic',sans-serif;color:var(--ink);background:#fff;line-height:1.7}
h1,h2,h3,b{font-family:'Readex Pro',sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700}
.logo-icon{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:1.2rem}
nav{display:flex;gap:4px;overflow-x:auto;padding:4px 0}
nav a{padding:6px 12px;border-radius:99px;color:var(--muted);font-size:.88rem;font-weight:600;white-space:nowrap}
nav a.on,nav a:hover{background:var(--blush);color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 18px;border-radius:99px;border:0;font-weight:600;cursor:pointer;font-size:.88rem}
.btn.red{background:var(--grad);color:#fff}.btn.line{background:#fff;border:1.5px solid var(--rose);color:var(--red)}
.btn.sm{padding:5px 12px;font-size:.8rem}
.hero{padding:36px 0;background:radial-gradient(circle at 90% 0,var(--blush),#fff)}
.hero h1{font-size:2.2rem;margin-bottom:8px}.hero h1 span{color:var(--red)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 10px 25px -15px rgba(225,29,46,.2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.field{width:100%;border:1.5px solid var(--rose);border-radius:12px;padding:9px 14px;outline:0;margin-top:4px}
.field:focus{border-color:var(--red)}
label{font-size:.82rem;font-weight:600;color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.75rem;font-weight:600;background:#E8F9EE;color:#117A3A}
.pill.out{background:var(--rose);color:var(--red-d)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:10px}
th{text-align:start;padding:8px;color:var(--muted);border-bottom:2px solid var(--rose)}td{padding:10px 8px;border-bottom:1px solid var(--line)}
.toast{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;background:var(--ink);color:#fff;padding:8px 18px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
dialog{border:0;border-radius:20px;padding:20px;width:min(480px,92vw);margin:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
</style>
</head>
<body>

<header class="top"><div class="wrap bar">
  <a class="logo" href="#/"><span class="logo-icon">📖</span><div><b id="siteTitle">مكتبة الأمين الذكية</b><div style="font-size:.7rem;color:var(--muted);font-weight:400">مدرسة الأمين الابتدائية</div></div></a>
  <nav id="nav"></nav>
</div></header>

<main id="app" class="wrap" style="padding-top:20px;padding-bottom:40px"></main>

<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script>
