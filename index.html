<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E11D2E">
<meta name="description" content="مكتبة الأمين الذكية - مدرسة الأمين الابتدائية">
<title>مكتبة الأمين الذكية | مدرسة الأمين الابتدائية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#E11D2E;--red-deep:#A80C20;--blush:#FFF5F3;--rose:#FFE4E1;--sun:#FFC22E;--sun-soft:#FFF3CC;--ink:#2B1216;--muted:#7A5B5F;--line:#F6D8D4;
--grad:linear-gradient(135deg,#FF7A52 0%,#E11D2E 55%,#A80C20 100%);--grad-sun:linear-gradient(135deg,#FFE066 0%,#FFC22E 60%,#FF9F1C 100%);--shadow:0 18px 40px -18px rgba(225,29,46,.45)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.8;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.d{font-family:'Readex Pro','IBM Plex Sans Arabic',sans-serif;line-height:1.35;font-weight:700}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid #F59E0B;outline-offset:2px;border-radius:8px}
svg.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
[hidden]{display:none!important}

header.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;min-height:68px}
.brand{display:flex;gap:10px;align-items:center;background:none;border:0;text-align:start}
.logo{width:44px;height:44px;border-radius:14px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:var(--shadow);position:relative}
.logo::after{content:"";position:absolute;top:-4px;inset-inline-start:-4px;width:14px;height:14px;border-radius:50%;background:var(--sun);border:3px solid #fff}
.logo svg{width:24px;height:24px}
.brand b{display:block;font-family:'Readex Pro';line-height:1.2}.brand small{color:var(--muted);font-size:.75rem}
nav{margin-inline-start:auto;display:flex;gap:2px}
nav a{padding:8px 13px;border-radius:999px;color:var(--muted);font-weight:500;font-size:.92rem;display:flex;gap:6px;align-items:center}
nav a:hover{background:var(--blush);color:var(--red)}
nav a.on{background:var(--grad);color:#fff}
.chip-s{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--rose);border-radius:999px;padding:4px 14px 4px 10px;font-size:.78rem;font-weight:600;white-space:nowrap}
.chip-s i{width:9px;height:9px;border-radius:50%;background:#b9a5a2}
.chip-s.ok i{background:#22C55E;animation:pu 2s infinite}.chip-s.bad i{background:#EF4444}
@keyframes pu{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.icon-btn{width:42px;height:42px;border-radius:13px;border:1.5px solid var(--rose);background:#fff;display:grid;place-items:center;color:var(--red);flex:none}
.menu-btn{display:none}
@media(max-width:900px){nav{display:none;position:absolute;top:68px;inset-inline:0;background:#fff;flex-direction:column;padding:10px 20px 18px;border-bottom:1px solid var(--line);box-shadow:0 24px 40px -24px rgba(225,29,46,.4)}nav.open{display:flex}nav a{padding:12px 14px}.chip-s{margin-inline-start:auto}.menu-btn{display:grid}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:999px;border:0;font-weight:600;font-family:'Readex Pro',sans-serif;font-size:.93rem;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}.btn:disabled{opacity:.6;transform:none;cursor:wait}
.btn.red{background:var(--grad);color:#fff;box-shadow:var(--shadow)}
.btn.sun{background:var(--grad-sun);color:var(--red-deep)}
.btn.line{background:#fff;border:2px solid var(--rose);color:var(--red)}
.btn.out{background:#fff;border:2px solid var(--red);color:var(--red)}
.btn.sm{padding:7px 15px;font-size:.82rem}
.mini{border:0;background:var(--blush);color:var(--red);border-radius:10px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600}
.mini:hover{background:var(--rose)}

.hero{padding:44px 0 56px;background:radial-gradient(800px 400px at 90% -10%,var(--sun-soft),transparent 60%),radial-gradient(600px 380px at 0% 110%,var(--rose),transparent 60%)}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr}}
.tag{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);padding:5px 14px;border-radius:999px;font-size:.84rem;color:var(--muted)}
h1.big{font-size:clamp(2.2rem,6vw,4rem);margin:16px 0 12px;letter-spacing:-.5px}
h1.big span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);font-size:1.1rem;max-width:30em}
.search{margin-top:24px;display:flex;gap:8px;background:#fff;border:2px solid var(--rose);border-radius:999px;padding:6px;max-width:520px;box-shadow:0 20px 40px -26px rgba(225,29,46,.55)}
.search:focus-within{border-color:var(--red)}
.search input{flex:1;min-width:0;border:0;outline:0;padding:0 16px;background:transparent}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.arch{position:relative;aspect-ratio:4/5;max-width:400px;margin-inline:auto;width:100%}
.arch .frame{position:absolute;inset:0;border-radius:999px 999px 32px 32px;background:var(--grad);box-shadow:0 40px 70px -34px rgba(168,12,32,.8);overflow:hidden}
.arch .sun{position:absolute;width:42%;aspect-ratio:1;border-radius:50%;background:var(--grad-sun);top:12%;inset-inline-start:30%;box-shadow:0 0 0 18px rgba(255,255,255,.14),0 0 0 40px rgba(255,255,255,.08)}
.arch svg.shelf{position:absolute;inset:auto 0 0 0;width:100%;height:auto}
.badge{position:absolute;background:#fff;border-radius:18px;padding:10px 16px;box-shadow:0 18px 30px -16px rgba(43,18,22,.45);display:flex;align-items:center;gap:10px;font-weight:600;font-size:.9rem}
.badge b{font-family:'Readex Pro';font-size:1.3rem;color:var(--red)}
.badge.b1{top:14%;inset-inline-end:-6%}.badge.b2{bottom:16%;inset-inline-start:-8%}
.badge .dot{width:36px;height:36px;border-radius:12px;background:var(--grad-sun);display:grid;place-items:center;color:var(--red-deep)}
.rise{opacity:0;transform:translateY(18px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}.d4{animation-delay:.35s}.d5{animation-delay:.5s}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:-28px;position:relative;z-index:2}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 22px 40px -28px rgba(225,29,46,.55);display:flex;gap:12px;align-items:center}
.stat .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--grad);color:#fff;flex:none}
.stat:nth-child(2) .ic{background:var(--grad-sun);color:var(--red-deep)}.stat:nth-child(3) .ic{background:var(--ink)}
.stat b{display:block;font-family:'Readex Pro';font-size:1.7rem;line-height:1.15}.stat span{color:var(--muted);font-size:.88rem}
@media(max-width:640px){.stats{grid-template-columns:1fr}}

section.b{padding:56px 0}.tint{background:var(--blush)}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.head h2{font-size:clamp(1.4rem,3.4vw,2rem)}.head p{color:var(--muted)}
.page-head{padding:40px 0 26px;background:linear-gradient(180deg,var(--blush),#fff)}
.page-head h1{font-size:clamp(1.8rem,4.5vw,2.7rem)}.page-head p{color:var(--muted);max-width:36em;margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px}
@media(max-width:860px){.tiles{grid-template-columns:1fr}}
.tile{border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:8px;min-height:170px;transition:transform .25s;position:relative;overflow:hidden;text-align:start;border:0}
.tile:hover{transform:translateY(-4px)}.tile h3{font-size:1.2rem}.tile p{font-size:.94rem;opacity:.92}
.tile .go{margin-top:auto;display:inline-flex;align-items:center;gap:8px;font-weight:600}
.tile.t1{background:var(--grad);color:#fff}.tile.t2{background:var(--grad-sun);color:var(--red-deep)}.tile.t3{background:#fff;border:2px solid var(--rose)}

.news{display:flex;gap:14px;padding:16px;border-radius:18px;background:#fff;border:1px solid var(--line);margin-bottom:12px;align-items:flex-start}
.news .date{flex:none;width:60px;text-align:center;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.news .date b{display:block;background:var(--grad);color:#fff;font-size:.7rem;padding:2px 0}
.news .date span{display:block;font-family:'Readex Pro';font-size:1.4rem;font-weight:700;color:var(--red);line-height:1.6}
.news h3{font-size:1.02rem;margin-bottom:2px}.news p{color:var(--muted);font-size:.93rem;white-space:pre-wrap}
.lnk{color:var(--red);font-weight:600;font-size:.85rem}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.comp{position:relative;padding:18px 20px;border-radius:18px;background:#fff;border:1px solid var(--line);margin-bottom:12px;overflow:hidden}
.comp::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:6px;background:var(--grad)}
.comp.soon::before{background:var(--grad-sun)}.comp.done::before{background:#d9c7c4}
.comp .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.comp h3{font-size:1.08rem;margin-bottom:2px}.comp p{color:var(--muted);font-size:.93rem}.comp small{color:var(--muted)}
.pill{display:inline-flex;align-items:center;padding:2px 12px;border-radius:999px;font-size:.76rem;font-weight:600}
.pill.on,.pill.free{background:#E8F9EE;color:#117A3A}.pill.soon{background:var(--sun-soft);color:#9A5B00}.pill.done{background:#F1E9E8;color:#7A5B5F}
.pill.out,.pill.wait{background:var(--rose);color:var(--red-deep)}.pill.late{background:var(--red);color:#fff}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.search-wide{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--rose);border-radius:999px;padding:3px 18px}
.search-wide:focus-within{border-color:var(--red)}.search-wide input{flex:1;border:0;outline:0;padding:99px 0;background:transparent}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:6px 15px;border-radius:999px;border:1.5px solid var(--rose);background:#fff;font-size:.88rem;font-weight:500;color:var(--muted)}
.cat:hover{border-color:var(--red);color:var(--red)}.cat.on{background:var(--grad);border-color:transparent;color:#fff}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.book{background:#fff;border:1px solid var(--line);border-radius:18px;padding:11px;display:flex;flex-direction:column;gap:10px;transition:transform .25s,box-shadow .25s}
.book:hover{transform:translateY(-4px);box-shadow:0 24px 36px -26px rgba(225,29,46,.6)}
.cover{aspect-ratio:3/4;border-radius:12px;position:relative;overflow:hidden;padding:14px 16px 14px 28px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.cover::before{content:"";position:absolute;inset-block:0;inset-inline-end:0;width:12px;background:rgba(0,0,0,.16)}
.cover::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.18);inset-inline-start:-26px;bottom:-26px}
.cover h4{font-size:1rem;position:relative;z-index:1;word-break:break-word}
.cover .dw{align-self:flex-start;background:rgba(255,255,255,.92);color:var(--red-deep);border-radius:999px;font-size:.74rem;font-weight:600;padding:1px 10px;position:relative;z-index:1}
.cover.lt{color:var(--red-deep)}
.book .meta{padding:0 4px}.book .meta b{display:block;font-size:.96rem}.book .meta span{color:var(--muted);font-size:.84rem}
.book .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:0 4px 4px;flex-wrap:wrap}
.book .who{font-size:.8rem;color:var(--muted);padding:0 4px}
.empty{text-align:center;padding:44px 18px;border:2px dashed var(--rose);border-radius:24px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:'Readex Pro';font-size:1.1rem;margin-bottom:4px}

.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 26px 44px -34px rgba(225,29,46,.5);margin-bottom:18px}
.card h3{font-size:1.1rem;margin-bottom:12px}
.field{width:100%;border:2px solid var(--rose);border-radius:14px;padding:10px 16px;outline:0;background:#fff}
.field:focus{border-color:var(--red)}textarea.field{resize:vertical;min-height:84px}
label.l{display:block;font-size:.84rem;font-weight:600;margin-bottom:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f2 .full{grid-column:1/-1}
@media(max-width:640px){.f2{grid-template-columns:1fr}}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.note{background:var(--sun-soft);color:#7A4B00;border-radius:14px;padding:10px 14px;font-size:.88rem;margin-bottom:14px}
.err{background:var(--rose);color:var(--red-deep);border-radius:14px;padding:10px 14px;font-size:.9rem;margin-top:12px}
.thanks{text-align:center;padding:10px 0}.thanks .ok{width:64px;height:64px;border-radius:50%;background:var(--grad-sun);color:var(--red-deep);display:grid;place-items:center;margin:0 auto 10px}

dialog{border:0;border-radius:24px;padding:22px;width:min(540px,94vw);max-height:92vh;overflow:auto;box-shadow:0 40px 80px -30px rgba(43,18,22,.6);color:var(--ink)}
dialog::backdrop{background:rgba(43,18,22,.5)}
dialog h3{margin-bottom:12px}

.chat{display:flex;flex-direction:column;height:min(620px,74vh);background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 30px 50px -36px rgba(225,29,46,.6)}
.chat-head{background:var(--grad);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
.chat-head .av{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--blush)}
.m{max-width:84%;padding:10px 15px;border-radius:18px;white-space:pre-wrap;word-break:break-word}
.m.bot{background:#fff;border:1px solid var(--line);border-end-start-radius:4px;align-self:flex-start}
.m.me{background:var(--grad);color:#fff;border-end-end-radius:4px;align-self:flex-end}
.typing{display:inline-flex;gap:4px;padding:4px 0}.typing i{width:7px;height:7px;border-radius:50%;background:var(--red);opacity:.4;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes bl{50%{opacity:1;transform:translateY(-3px)}}
.quick{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px 0;background:#fff}
.quick button{border:1.5px solid var(--rose);background:#fff;border-radius:999px;padding:4px 13px;font-size:.84rem;color:var(--red);font-weight:500}
.say{display:flex;gap:8px;padding:10px 14px 14px;background:#fff}
.say input{flex:1;min-width:0;border:2px solid var(--rose);border-radius:999px;padding:9px 16px;outline:0}.say input:focus{border-color:var(--red)}
.say button{width:46px;height:46px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none}

.adm{padding:34px 0 52px;min-height:70vh;background:linear-gradient(180deg,var(--blush),#fff 260px)}
.login{max-width:420px;margin:26px auto;display:flex;flex-direction:column;gap:12px;text-align:center}
.lock{width:60px;height:60px;border-radius:20px;background:var(--grad);color:#fff;display:grid;place-items:center;margin:0 auto;box-shadow:var(--shadow)}
.admgrid{display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:start}
.tabs{display:flex;flex-direction:column;gap:6px;position:sticky;top:84px}
.tab{text-align:start;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 16px;font-weight:600;display:flex;gap:10px;align-items:center;color:var(--muted)}
.tab.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--shadow)}
@media(max-width:860px){.admgrid{grid-template-columns:1fr}.tabs{flex-direction:row;overflow-x:auto;position:static;padding-bottom:6px}.tab{flex:none;white-space:nowrap}}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media(max-width:760px){.kp{grid-template-columns:repeat(2,1fr)}}
.kp div{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}
.kp b{display:block;font-family:'Readex Pro';font-size:1.6rem;color:var(--red);line-height:1.2}.kp span{color:var(--muted);font-size:.86rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:start;color:var(--muted);font-weight:600;font-size:.8rem;padding:8px 10px;border-bottom:2px solid var(--rose)}td{padding:10px;border-bottom:1px solid var(--line)}
.rw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}.rw:first-of-type{border-top:0}
.rw b{display:block;font-size:.95rem}.rw .s{color:var(--muted);font-size:.85rem}

footer.foot{margin-top:20px;background:var(--grad);color:#fff}
footer.foot .in{padding:28px 20px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
footer.foot .cr{background:rgba(255,255,255,.16);padding:7px 16px;border-radius:999px;font-size:.9rem}
.toast{position:fixed;bottom:20px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90vw;background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;opacity:0;transform:translateY(16px);transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:none}
.skel{padding:60px 0;text-align:center;color:var(--muted)}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--rose);border-top-color:var(--red);margin:0 auto 10px;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

.rc{position:relative;border-radius:28px;overflow:hidden;background:linear-gradient(160deg,#3A1A20,#1B0A0E);aspect-ratio:4/5;max-height:72vh;margin:0 auto;box-shadow:0 40px 70px -34px rgba(168,12,32,.85);border:5px solid #fff;outline:2px solid var(--rose)}
.rc video{width:100%;height:100%;object-fit:cover;display:block}
.mir{transform:scaleX(-1)}
.rcst{position:absolute;top:12px;inset-inline-start:12px;background:rgba(0,0,0,.5);color:#fff;border-radius:999px;padding:3px 13px;font-size:.8rem;z-index:2}
.rcard{position:absolute;inset-inline:12px;bottom:12px;background:#fff;border-radius:22px;padding:12px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 14px 30px -12px rgba(0,0,0,.55);z-index:2;animation:rise .5s both}
.rcard .av{width:48px;height:48px;border-radius:15px;background:var(--grad-sun);display:grid;place-items:center;color:var(--red-deep);flex:none}
.rcard b{display:block;font-family:'Readex Pro';line-height:1.35}.rcard small{color:var(--muted)}

@media(max-width:640px){
html{font-size:14px}.wrap{padding:0 14px}.bar{min-height:58px;gap:8px}
.logo{width:36px;height:36px;border-radius:12px}.logo svg{width:20px;height:20px}.logo::after{width:11px;height:11px;border-width:2px}
.brand b{font-size:.95rem}.brand small{font-size:.68rem}nav{top:58px}.icon-btn{width:36px;height:36px;border-radius:11px}
.chip-s{padding:3px 10px 3px 8px;font-size:.72rem}
.hero{padding:24px 0 38px}h1.big{font-size:2rem;margin:10px 0 8px}.lead{font-size:1rem}
.search{margin-top:16px;padding:4px}.btn{padding:10px 16px;font-size:.88rem}.btn.sm{padding:6px 12px;font-size:.78rem}.cta{gap:8px;margin-top:14px}

<body>

  <button class="icon-btn menu-btn" id="menuBtn" aria-label="القائمة" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>

<main id="app" tabindex="-1"></main>

<footer class="foot"><div class="wrap in">
  <div><b class="d">مكتبة الأمين الذكية</b><div style="opacity:.9;font-size:.88rem">مدرسة الأمين الابتدائية — إدارة شمال التعليمية — بورسعيد</div></div>

</div></footer>

<script>
/* ================= الإعدادات والربط ================= */
const SB_URL = 'https://eyixmpzvqsmxtevwchhi.supabase.co';
const SB_KEY = 'sb_publishable_sj46rj0N03ETRqqchfIPbw_TCGPCqlr';
const PUB_COLS = 'id,accession_no,title,author,publisher,dewey,status,created_at';

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => Number(n || 0).toLocaleString('ar-EG');
const pad = n => String(n).padStart(2, '0');
const dayKey = d => { d = new Date(d); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const todayStr = () => dayKey(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate()+n); return dayKey(d); };
const fmtDate = d => new Date(d.length === 10 ? d+'T12:00:00' : d).toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'});
const norm = s => String(s||'').toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').trim();
const safeUrl = u => /^https?:\/\//i.test(u||'') ? u : '';

const mem = {};
const store = {
  get(k,d){ try{ const v = localStorage.getItem('amin:'+k); return v ? JSON.parse(v) : (k in mem ? mem[k] : d); }catch(e){ return k in mem ? mem[k] : d; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem('amin:'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ delete mem[k]; try{ localStorage.removeItem('amin:'+k); }catch(e){} }
};
function toast(m){ const t=$('#toast'); if(!t) return; t.textContent=m; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),2400); }

const IC = {
  book:'<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
  trophy:'<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
  mega:'<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  grid:'<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  down:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
  up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',
  back:'<path d="m15 18-6-6 6-6"/>', star:'<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.3-6.2 3.3L8 14.2 3 9.3l6.9-1z"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>', camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>', lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>'
};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]||''}</svg>`;
const DEWEY = {0:'عموميات',1:'الفلسفة',2:'الأديان',3:'العلوم الاجتماعية',4:'اللغات',5:'العلوم الطبيعية',6:'العلوم التطبيقية',7:'الفنون',8:'الأدب',9:'التاريخ والجغرافيا'};
const DEF_SETTINGS = {site_name:'مكتبة الأمين الذكية', library_hours:'خلال اليوم الدراسي، حسب جدول الحصص الخاص بكل فصل.', borrowing_rules:'يمكن استعارة كتاب واحد في المرة الواحدة، ويُعاد خلال أسبوع.'};
const PURPOSES = ['قراءة','استعارة كتاب','إرجاع كتاب','نشاط أو مسابقة','أخرى'];

/* ================= Supabase API ================= */
let session = store.get('session', null);
function setSession(s){ if(s){ s.expires_at = Date.now() + (s.expires_in||3600)*1000; } session = s; s ? store.set('session', s) : store.del('session'); }
async function refresh(){
  if(!session || !session.refresh_token) return false;
  try{
    const r = await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});
    if(!r.ok){ setSession(null); return false; }
    setSession(await r.json()); return true;
  }catch(e){ return false; }
}
async function fresh(){ if(session && session.expires_at && Date.now() > session.expires_at - 60000) await refresh(); }
async function api(path, o={}){
  const {method='GET', body, prefer, anon=false, retry=true} = o;
  if(!anon) await fresh();
  const h = {apikey:SB_KEY,'Content-Type':'application/json'};
  if(!anon && session && session.access_token) h.Authorization = 'Bearer '+session.access_token;
  if(prefer) h.Prefer = prefer;
  let r;
  try{ r = await fetch(SB_URL+'/rest/v1/'+path,{method,headers:h,body:body!==undefined?JSON.stringify(body):undefined}); }
  catch(e){ throw new Error('تعذّر الاتصال بالإنترنت أو بالخادم'); }
  if(r.status===401 && !anon && session && retry){ if(await refresh()) return api(path,{...o,retry:false}); }
  if(!r.ok){
    let m = 'حدث خطأ ('+r.status+')';
    try{ const j = await r.json(); m = j.message || j.hint || m; }catch(e){}
    if(r.status===401||r.status===403) m = 'لا تملك صلاحية لهذا الإجراء';
    throw new Error(m);
  }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
async function count(path){
  await fresh();
  const h = {apikey:SB_KEY,Prefer:'count=exact','Range-Unit':'items',Range:'0-0'};
  if(session && session.access_token) h.Authorization = 'Bearer '+session.access_token;
  const r = await fetch(SB_URL+'/rest/v1/'+path,{headers:h});
  if(!r.ok) throw new Error('تعذّر جلب الأرقام');
  const n = parseInt((r.headers.get('content-range')||'').split('/')[1],10);
  return isNaN(n) ? 0 : n;
}
async function login(email, password){
  let r, j;
  try{
    r = await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    j = await r.json().catch(()=>({}));
  }catch(e){ throw new Error('تعذّر الاتصال بالإنترنت'); }
  if(!r.ok) throw new Error('البريد أو كلمة السر غير صحيحة');
  setSession(j); S.role = null; S.verified = false;
  const role = await ensureRole();
  if(!role) throw new Error('هذا الحساب غير مصرّح له بالدخول');
  S.books = null; S.news = null;
}
async function logout(){
  try{ if(session) await fetch(SB_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+session.access_token}}); }catch(e){}
  setSession(null); S.verified = false; S.role = null; S.books = null; S.news = null;
}

/* ================= الحالة والبيانات ================= */
const S = {books:null,news:null,comps:null,settings:null,stats:null,q:'',cat:'all',tab:'ov',verified:false,role:null,chat:[],justVisited:false,people:[]};
async function loadStats(){ S.stats = await api('rpc/public_stats',{method:'POST',body:{},anon:true}).catch(()=>({books:0,visitors_today:0,active_competitions:0})); setChip(true); return S.stats; }
async function loadBooks(force){ if(S.books && !force) return S.books; S.books = await api('books?select='+(session?'*':PUB_COLS)+'&order=created_at.desc&limit=2000',{anon:!session}).catch(()=>[]); return S.books; }
async function loadNews(force){ if(S.news && !force) return S.news; S.news = await api('announcements?select=*&order=created_at.desc&limit=60',{anon:!session}).catch(()=>[]); return S.news; }
async function loadComps(force){ if(S.comps && !force) return S.comps; S.comps = await api('competitions?select=*&order=start_date.desc&limit=100',{anon:true}).catch(()=>[]); return S.comps; }
async function loadSettings(force){
  if(S.settings && !force) return S.settings;
  try{ const r = await api('settings?select=*&id=eq.1',{anon:true}); S.settings = Object.assign({}, DEF_SETTINGS, r && r[0] || {}); }catch(e){ S.settings = DEF_SETTINGS; }
  const el = $('#siteName'); if(el) el.textContent = S.settings.site_name; return S.settings;
}
function setChip(ok){ const c=$('#chip'); if(!c) return; c.className = 'chip-s '+(ok?'ok':'bad'); c.lastElementChild.textContent = ok ? 'متصل بقاعدة البيانات' : 'غير متصل'; }
const compState = c => { const t = todayStr(); return t < c.start_date ? 'soon' : t > c.end_date ? 'done' : 'on'; };
const compLabel = {on:'جارية',soon:'قريبًا',done:'انتهت'};

/* ================= عناصر واجهة المستخدم ================= */
const COVERS = [['#FF7A52','#E11D2E'],['#FFD65C','#FF9F1C','lt'],['#E11D2E','#7A0A1A'],['#FF8FA3','#E11D2E'],['#FFE08A','#FF6A4D','lt'],['#FF5A4F','#B80F25'],['#FFC22E','#E11D2E']];
function cover(b){ let h=0; for(const ch of String(b.title)) h=(h*31+ch.charCodeAt(0))>>>0; const c=COVERS[h%COVERS.length];
  return `<div class="cover ${c[2]||''}" style="background:linear-gradient(150deg,${c[0]},${c[1]})"><span class="dw">${esc(b.dewey||'—')}</span><h4>${esc(b.title)}</h4></div>`; }
function shelfSVG(){
  const cols=['#FFFFFF','#FFC22E','#FFE4E1','#7A0A1A','#FFD65C','#FFFFFF','#FF9F1C','#FFE4E1','#FFC22E'];
  const rows=[{y:70,h:[62,78,54,84,66,74,58,80,64,70]},{y:178,h:[70,56,82,64,76,60,84,52,72,66]}];
  let o='<svg class="shelf" viewBox="0 0 400 300" aria-hidden="true">';
  rows.forEach((r,ri)=>{ let x=34; r.h.forEach((h,i)=>{ const w=22+(i*7)%12; o+=`<rect x="${x}" y="${r.y+(86-h)}" width="${w}" height="${h}" rx="4" fill="${cols[(i+ri*3)%cols.length]}"/><rect x="${x+4}" y="${r.y+(86-h)+10}" width="${w-8}" height="3" rx="1.5" fill="#E11D2E" opacity=".35"/>`; x+=w+4; });
    o+=`<rect x="20" y="${r.y+88}" width="360" height="8" rx="4" fill="#fff"/><rect x="20" y="${r.y+96}" width="360" height="5" rx="2.5" fill="#000" opacity=".14"/>`; });
  return o+'</svg>';
}
function newsItem(n, adm){
  const d = new Date(n.created_at||Date.now()), u = safeUrl(n.source_url);
  return `<article class="news"><div class="date"><b>${d.toLocaleDateString('ar-EG',{month:'long'})}</b><span>${nf(d.getDate())}</span></div>
  <div style="flex:1;min-width:0"><h3>${esc(n.title)} ${n.published===false?'<span class="pill wait">مسودة</span>':''}</h3><p>${esc(n.body||'')}</p>${u?`<a class="lnk" href="${esc(u)}" target="_blank" rel="noopener">المصدر</a>`:''}</div>
  ${adm?`<div class="acts"><button class="mini" data-act="news-toggle" data-id="${n.id}">${n.published?'إخفاء':'نشر'}</button><button class="mini" data-act="news-del" data-id="${n.id}">${ic('trash')}</button></div>`:''}</article>`;
}
function compItem(c, adm){
  const st = compState(c);
  return `<article class="comp ${st}"><div class="row"><h3>${esc(c.title)}</h3><span class="pill ${st}">${compLabel[st]}</span></div>
  <p>${esc(c.description||'')}</p><small>من ${fmtDate(c.start_date)} إلى ${fmtDate(c.end_date)}</small>${adm?` <button class="mini" style="margin-inline-start:8px" data-act="comp-del" data-id="${c.id}">${ic('trash')} حذف</button>`:''}</article>`;
}
function bookCard(b){
  const adm = !!session && S.verified;
  const late = adm && b.status==='borrowed' && b.due_date && b.due_date < todayStr();
  return `<article class="book">${cover(b)}
  <div class="meta"><b>${esc(b.title)}</b><span>${esc(b.author||'مؤلف غير محدد')}${b.accession_no?' · رقم '+esc(b.accession_no):''}</span></div>
  ${adm && b.status==='borrowed' ? `<div class="who">معار لـ ${esc(b.borrower_name\vert{}\vert{}'—')}${b.due_date?' · حتى '+fmtDate(b.due_date):''}</div>`:''}
  <div class="foot"><span><span class="pill ${b.status==='borrowed'?'out':'free'}">${b.status==='borrowed'?'معار':'متاح'}</span> ${late?'<span class="pill late">متأخر</span>':''}</span>
  ${adm?`<span class="acts">${b.status==='borrowed'?`<button class="mini" data-act="book-return" data-id="${b.id}">إرجاع</button>`:`<button class="mini" data-act="book-borrow" data-id="${b.id}">إعارة</button>`}<button class="mini" data-act="book-edit" data-id="${b.id}">${ic('edit')}</button><button class="mini" data-act="book-del" data-id="${b.id}">${ic('trash')}</button></span>`:''}</div></article>`;
}
function filteredBooks(){
  const q = norm(S.q);
  return (S.books||[]).filter(b=>{
    const okQ = !q || norm([b.title,b.author,b.accession_no,b.dewey,b.publisher].join(' ')).includes(q);
    const d = parseFloat(b.dewey);
    const okC = S.cat==='all' || (isNaN(d) ? S.cat==='0' : Math.floor(d/100)===+S.cat);
    return okQ && okC;
  });
}
function bookListHTML(){ const l = filteredBooks(); return l.length ? l.map(bookCard).join('') : `<div class="empty" style="grid-column:1/-1"><b>لا توجد نتائج</b>${(S.books||[]).length?'جرّب كلمة أخرى أو تصنيفًا مختلفًا.':'لم تتم إضافة كتب بعد.'}</div>`; }
function catsHTML(){ return `<button class="cat ${S.cat==='all'?'on':''}" data-cat="all">الكل</button>`+Object.keys(DEWEY).map(k=>`<button class="cat ${S.cat===k?'on':''}" data-cat="${k}">${k}00 · ${DEWEY[k]}</button>`).join(''); }
const pageHead = (t,p) => `<div class="page-head"><div class="wrap"><h1>${t}</h1><p>${p}</p></div></div>`;
const errCard = m => `<div class="wrap" style="padding:50px 0"><div class="empty"><b>تعذّر تحميل الصفحة</b>${esc(m)}<div class="btns" style="justify-content:center"><button class="btn red sm" data-act="retry">إعادة المحاولة</button></div></div></div>`;

/* ================= الصفحات ================= */
const pages = {};
pages.home = async () => {
  const [st, news, comps] = await Promise.all([loadStats(), loadNews(), loadComps()]);
  const s = st || {books:0,visitors_today:0,active_competitions:0};
  const latest = (news||[]).filter(n=>n.published!==false).slice(0,3);
  const act = (comps||[]).filter(c=>compState(c)!=='done').slice(0,3);
  return `
  <section class="hero"><div class="wrap hero-grid">
    <div>
      <span class="tag rise d1">${ic('star')} مساحة مدرسية تحفظ المعرفة وتستقبل الزوار بأحدث التقنيات</span>
      <h1 class="big rise d2">مكتبة <span>الأمين</span> الذكية</h1>
      <p class="lead rise d3">ابحث عن كتابك، سجّل زيارتك، واطّلع على المسابقات والإعلانات. كل ما تحتاجه من مكتبة المدرسة في مكان واحد.</p>
      <form class="search rise d4" data-form="hero-search" role="search"><input name="q" placeholder="ابحث بعنوان الكتاب أو اسم المؤلف" aria-label="ابحث عن كتاب" autocomplete="off"><button class="btn red" type="submit">${ic('search')} بحث</button></form>
      <div class="cta rise d5"><a class="btn sun" href="#/visitors">${ic('users')} تسجيل زائر</a><a class="btn line" href="#/support">${ic('chat')} اسأل المساعد</a>${session?`<a class="btn out" href="#/reception">${ic('camera')} وضع الاستقبال</a>`:''}</div>
    </div>
    <div class="arch rise d3"><div class="frame"><div class="sun"></div>${shelfSVG()}</div>
      <div class="badge b1"><span class="dot">${ic('book')}</span><div><b>${nf(s.books)}</b><div style="font-weight:500;font-size:.75rem;color:var(--muted)">كتاب في الفهرس</div></div></div>
      <div class="badge b2"><span class="dot">${ic('trophy')}</span><div><b>${nf(s.active_competitions)}</b><div style="font-weight:500;font-size:.75rem;color:var(--muted)">مسابقة جارية</div></div></div></div>

async function chatReply(q){
  const t = norm(q);
  const [st, comps, news, books] = await Promise.all([loadSettings(), loadComps(), loadNews(), loadBooks()]);
  const act = comps.filter(c=>compState(c)!=='done');
  if(/مواعيد|ساعات|يفتح|مفتوح|وقت/.test(t)) return 'مواعيد المكتبة: '+st.library_hours;
  if(/استعار|اعار|استلاف|ارجاع/.test(t)) return st.borrowing_rules;
  if(/مسابق/.test(t)) return act.length ? 'المسابقات الحالية:\n'+act.map(c=>`• ${c.title} — حتى ${fmtDate(c.end_date)}`).join('\n') : 'لا توجد مسابقات حاليًا.';
  const words = t.replace(/[؟?!.،,:;"'()]/g,' ').split(/\s+/).filter(w=>w.length>1);
  if(words.length){
    const hits = books.filter(b=>words.some(w=>norm(b.title+' '+(b.author||'')).includes(w))).slice(0,5);
    if(hits.length) return 'نتائج الفهرس:\n'+hits.map(b=>`• ${b.title} — ${b.status==='borrowed'?'معار':'متاح'}`).join('\n');
  }
  return 'يمكنك الاستفسار عن المواعيد، الإعارة، أو المسابقات المتاحة.';
}

/* ================= التنقل والتحميل ================= */
const ROUTES = {home:'الرئيسية',books:'الكتب',competitions:'المسابقات',announcements:'الإعلانات',visitors:'الزائرون',support:'الدعم الذكي',reception:'الاستقبال',dashboard:'لوحة التحكم'};
const NAVICON = {home:'grid',books:'book',competitions:'trophy',announcements:'mega',visitors:'users',support:'chat',reception:'camera',dashboard:'star'};
let route = 'home', token = 0;
function routeFromHash(){ const seg = (location.hash||'').replace(/^#\/?/,'').split(/[\/?]/)[0]; return ROUTES[seg] ? seg : 'home'; }
function go(r){ route = ROUTES[r] ? r : 'home'; try{ history.replaceState(null,'', route==='home' ? location.pathname+location.search : '#/'+route); }catch(e){} render(); window.scrollTo(0,0); }
function setNav(){ const el=$('#nav'); if(el) el.innerHTML = Object.keys(ROUTES).map(k=>`<a href="#/${k==='home'?'':k}" class="${k===route?'on':''}">${ic(NAVICON[k])}${ROUTES[k]}</a>`).join(''); }

async function render(){
  const my = ++token;
  setNav();
  document.title = (route==='home' ? '' : (ROUTES[route] || 'الرئيسية') + ' | ') + (S.settings ? S.settings.site_name : 'مكتبة الأمين الذكية');
  const app = $('#app'); if(!app) return;
  app.innerHTML = '<div class="skel"><div class="spin"></div>جارٍ التحميل...</div>';
  loadSettings().catch(()=>{});
  try{
    if(typeof pages[route] !== 'function') throw new Error('الصفحة غير موجودة');
    const html = await pages[route]();
    if(my!==token) return;
    app.innerHTML = html;
  }catch(e){
    if(my!==token) return;
    app.innerHTML = errCard(e.message||'تعذّر عرض الصفحة');
    setChip(false);
  }
}

/* ================= إدارة الأحداث والتفاعلات ================= */
document.addEventListener('input', e=>{ if(e.target.id==='bq'){ S.q=e.target.value; const l=$('#booklist'); if(l) l.innerHTML=bookListHTML(); } });

document.addEventListener('click', async e=>{
  const a = e.target.closest('a[href^="#"]');
  if(a){ e.preventDefault(); const h=a.getAttribute('href'); go(h==='#'||h==='#/' ? 'home' : h.replace(/^#\//,'').split(/[\/?]/)[0]); return; }
  const cat = e.target.closest('[data-cat]'); if(cat){ S.cat=cat.dataset.cat; $('#cats').innerHTML=catsHTML(); $('#booklist').innerHTML=bookListHTML(); return; }
  const tab = e.target.closest('[data-tab]'); if(tab){ S.tab=tab.dataset.tab; render(); return; }
  const qk = e.target.closest('[data-q]'); if(qk){ ask(qk.dataset.q); return; }
  
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  try{
    if(act==='retry') render();
    else if(act==='book-add') openDlg(bookForm(null));
    else if(act==='book-edit'){ const bk = S.books.find(x=>x.id===id); openDlg(bookForm(bk)); }
    else if(act==='book-del'){ if(confirm('هل تريد حذف هذا الكتاب؟')){ await api('books?id=eq.'+encodeURIComponent(id),{method:'DELETE'}); S.books=null; toast('تم حذف الكتاب'); render(); } }
    else if(act==='book-borrow'){
      const name = prompt('اسم المستعير:');
      if(name){
        await api('books?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:{status:'borrowed',borrower_name:name,due_date:addDays(7)}});
        S.books=null; toast('تم إعارة الكتاب'); render();
      }
    }
    else if(act==='book-return'){
      await api('books?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:{status:'available',borrower_name:null,due_date:null}});
      S.books=null; toast('تم إرجاع الكتاب'); render();
    }
    else if(act==='person-add') openDlg(personForm(null));
    else if(act==='person-edit') openDlg(personForm(S.people.find(x=>x.id===id)));
    else if(act==='person-del'){ if(confirm('حذف هذا الشخص؟')){ await api('people?id=eq.'+encodeURIComponent(id),{method:'DELETE'}); toast('تم الحذف'); render(); } }
    else if(act==='news-toggle'){ const n = S.news.find(x=>x.id===id); await api('announcements?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:{published:!n.published}}); S.news=null; toast('تم التحديث'); render(); }
    else if(act==='news-del'){ if(confirm('حذف هذا الإعلان؟')){ await api('announcements?id=eq.'+encodeURIComponent(id),{method:'DELETE'}); S.news=null; toast('تم الحذف'); render(); } }
    else if(act==='comp-del'){ if(confirm('حذف المسابقة؟')){ await api('competitions?id=eq.'+encodeURIComponent(id),{method:'DELETE'}); S.comps=null; toast('تم الحذف'); render(); } }
    else if(act==='visitor-del'){ await api('visitors?id=eq.'+encodeURIComponent(id),{method:'DELETE'}); toast('تم حذف الزيارة'); render(); }
    else if(act==='visit-again'){ S.justVisited=false; render(); }
    else if(act==='ai-test'){
      const out=$('#airesult'); if(out){ out.hidden=false; out.textContent='جارٍ الاتصال واختبار الاستجابة...'; }
      setTimeout(()=>{ if(out) out.textContent='تم الاتصال بنجاح بالنظام السحابي!'; },1200);
    }
    else if(act==='export-visitors'){
      const data = await api('visitors?select=*&order=created_at.desc');
      const csv = 'data:text/csv;charset=utf-8,الاسم,الفصل,السبب,التاريخ\n'+data.map(v=>`"${v.name}","${v.class_name||''}","${v.purpose}","${v.created_at}"`).join('\n');
      window.open(encodeURI(csv));
    }
    else if(act==='export-books'){
      const data = await api('books?select=*');
      const csv = 'data:text/csv;charset=utf-8,الرقم العام,العنوان,المؤلف,التصنيف,الحالة\n'+data.map(x=>`"${x.accession_no||''}","${x.title}","${x.author||''}","${x.dewey||''}","${x.status}"`).join('\n');
      window.open(encodeURI(csv));
    }
    else if(act==='logout'){ await logout(); toast('تم تسجيل الخروج'); render(); }
    else if(act==='rc-start'){
      try{
        const stream = await navigator.mediaDevices.getUserMedia({video:true});
        const vid = $('#rcVideo'); if(vid){ vid.srcObject = stream; vid.play(); $('#rcStatus').textContent='الكاميرا تعمل بنجاح'; }
      }catch(e){ toast('يرجى التكرم بالسماح بصلاحية الكاميرا للمتصفح'); }
    }
  }catch(err){ toast(err.message); }
});

async function ask(q){
  q = (q||'').trim(); if(!q) return;
  S.chat.push({me:true,t:q},{typing:true}); drawChat();
  let r; try{ r = await chatReply(q); }catch(e){ r = 'حدث خطأ في الاتصال.'; }
  S.chat = S.chat.filter(m=>!m.typing); S.chat.push({t:r}); drawChat();
}

document.addEventListener('submit', async e=>{
  const f = e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  const type = f.dataset.form, d = Object.fromEntries(new FormData(f).entries());
  try{
    if(type==='hero-search'){ S.q = d.q||''; S.cat='all'; go('books'); }
    else if(type==='chat'){ f.reset(); ask(d.q); }
    else if(type==='visitor'){ await api('visitors',{method:'POST',body:{name:d.name.trim(),class_name:d.class_name.trim()||null,purpose:d.purpose}}); S.justVisited=true; render(); }
    else if(type==='login'){ await login(d.email.trim(), d.password); render(); toast('أهلًا بك'); }
    else if(type==='book'){
      const body = {title:d.title.trim(),author:d.author.trim()||null,publisher:d.publisher.trim()||null,dewey:d.dewey.trim()||null,accession_no:d.accession_no.trim()||null};
      if(d.id) await api('books?id=eq.'+encodeURIComponent(d.id),{method:'PATCH',body});
      else await api('books',{method:'POST',body});
      S.books=null; closeDlg(); toast('تم حفظ الكتاب'); render();
    }
    else if(type==='person'){
      const body = {full_name:d.full_name.trim(),job_title:d.job_title.trim()||null,greeting_first:d.greeting_first.trim()||null};
      if(d.id) await api('people?id=eq.'+encodeURIComponent(d.id),{method:'PATCH',body});
      else await api('people',{method:'POST',body});
      closeDlg(); toast('تم الحفظ'); render();
    }
    else if(type==='news'){ await api('announcements',{method:'POST',body:{title:d.title.trim(),body:d.body.trim()||null,published:true}}); S.news=null; toast('تم نشر الإعلان'); render(); }
    else if(type==='comp'){ await api('competitions',{method:'POST',body:{title:d.title.trim(),start_date:d.start_date,end_date:d.end_date}}); S.comps=null; toast('تمت إضافة المسابقة'); render(); }
    else if(type==='settings'){ await api('settings?id=eq.1',{method:'PATCH',body:{site_name:d.site_name,library_hours:d.library_hours,borrowing_rules:d.borrowing_rules}}); toast('تم حفظ الإعدادات'); render(); }
    else if(type==='apset'){ await api('ai_settings?id=eq.1',{method:'PATCH',body:{analysis_model:d.analysis_model.trim()}}); toast('تم حفظ نموذج الـ AI'); }
  }catch(err){ toast(err.message); }
});

window.addEventListener('hashchange',()=>{ const r=routeFromHash(); if(r!==route){ route=r; render(); window.scrollTo(0,0); } });
route = routeFromHash();
render();
</script>
</body>
</html>
